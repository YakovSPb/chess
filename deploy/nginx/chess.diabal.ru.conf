# ChessTrain — chess.diabal.ru
# Статика: /root/chess/apps/web/dist
# API:    127.0.0.1:8000

server {
    listen 80;
    listen [::]:80;
    server_name chess.diabal.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chess.diabal.ru;

    ssl_certificate /etc/letsencrypt/live/chess.diabal.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chess.diabal.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/chess.diabal.ru;
    index index.html;
    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
